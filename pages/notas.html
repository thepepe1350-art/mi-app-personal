  <!-- ==========================================
       ENCABEZADO
  =========================================== -->
  <header class="encabezado">
    <h1>Notas</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="interruptor" id="btnTema" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro"></button>
      <button class="btn btn-primario" id="btnAgregarNota" style="padding:8px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Nueva nota
      </button>
    </div>
  </header>

  <!-- ==========================================
       CONTENIDO PRINCIPAL
  =========================================== -->
  <main class="contenido pagina-enter">

    <!-- Barra de búsqueda -->
    <div style="position:relative; margin-bottom:12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--color-texto-suave); pointer-events:none;">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        class="campo"
        type="search"
        id="campoBusqueda"
        placeholder="Buscar en notas..."
        style="padding-left:38px;"
        autocomplete="off"
      >
    </div>

    <!-- Filtro de etiquetas (se rellena cuando hay etiquetas guardadas) -->
    <div id="filtroEtiquetas" style="display:none; margin-bottom:12px;">
      <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
        <span style="font-size:0.8rem; color:var(--color-texto-suave); font-weight:600;">Etiquetas:</span>
        <div id="listaEtiquetasFiltro" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
      </div>
    </div>

    <!-- Contador de notas -->
    <p id="textoContador" style="font-size:0.85rem; color:var(--color-texto-suave); margin-bottom:12px; padding-left:2px;"></p>

    <!-- Cuadrícula de notas (2 columnas en pantallas grandes) -->
    <div id="cuadriculaNotas" class="cuadricula-notas"></div>

  </main>

  <!-- ==========================================
       MODAL: AGREGAR / EDITAR NOTA
  =========================================== -->
  <div class="modal-fondo" id="modalNota" style="display:none;">
    <div class="modal-caja">

      <div class="modal-titulo">
        <span id="modalNotasTitulo">Nueva nota</span>
        <button class="modal-cerrar" id="btnCerrarModal" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="formNota" novalidate>
        <input type="hidden" id="notaId">

        <!-- Título -->
        <div class="grupo-campo">
          <label class="etiqueta" for="notaTitulo">Título *</label>
          <input class="campo" type="text" id="notaTitulo" placeholder="Ej: Ideas para el proyecto" maxlength="100" required>
        </div>

        <!-- Contenido -->
        <div class="grupo-campo">
          <label class="etiqueta" for="notaContenido">Contenido</label>
          <textarea class="campo" id="notaContenido" placeholder="Escribe lo que quieras..." rows="6" style="resize:vertical;" maxlength="5000"></textarea>
        </div>

        <!-- Etiquetas -->
        <div class="grupo-campo">
          <label class="etiqueta" for="notaEtiquetas">Etiquetas (separadas por coma)</label>
          <input class="campo" type="text" id="notaEtiquetas" placeholder="Ej: trabajo, ideas, urgente" maxlength="200">
          <p style="font-size:0.78rem; color:var(--color-texto-suave); margin-top:4px;">Escribe varias etiquetas separadas por coma</p>
        </div>

        <!-- Anclar nota -->
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.9rem;">
            <input type="checkbox" id="notaAnclada" style="width:18px; height:18px; cursor:pointer;">
            Anclar esta nota (aparece siempre arriba)
          </label>
        </div>

        <!-- Botones -->
        <div class="modal-acciones">
          <button type="button" class="btn btn-peligro" id="btnEliminarNota" style="display:none; flex:0 0 auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3,6 5,6 21,6"/>
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            Eliminar
          </button>
          <button type="submit" class="btn btn-primario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17,21 17,13 7,13 7,21"/>
            </svg>
            Guardar
          </button>
        </div>

      </form>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/modules/notas.js"></script>

</body>
