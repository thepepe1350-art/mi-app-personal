  <header class="encabezado">
    <h1>Agenda</h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="interruptor" id="btnTema" aria-label="Cambiar tema"></button>
      <button class="btn btn-primario" id="btnNuevoEvento" style="padding:8px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo evento
      </button>
    </div>
  </header>

  <main class="contenido pagina-enter">

    <!-- Navegación del mes -->
    <div class="tarjeta" style="padding:12px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <button class="btn btn-secundario" id="btnMesAnterior" style="padding:6px 12px;">‹</button>
        <h2 id="tituloMes" style="font-size:1rem; font-weight:700;"></h2>
        <button class="btn btn-secundario" id="btnMesSiguiente" style="padding:6px 12px;">›</button>
      </div>

      <!-- Encabezados de los días de la semana -->
      <div class="calendario-semana">
        <span>Lun</span><span>Mar</span><span>Mié</span>
        <span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
      </div>

      <!-- Cuadrícula del calendario (se rellena con JS) -->
      <div id="calendarioGrid" class="calendario-grid"></div>
    </div>

    <!-- Eventos del día seleccionado -->
    <div class="tarjeta" id="panelDia">
      <div class="tarjeta-titulo" id="tituloDia">Selecciona un día</div>
      <div id="eventosDia" class="lista-items"></div>
    </div>

  </main>

  <!-- MODAL: AGREGAR / EDITAR EVENTO -->
  <div class="modal-fondo" id="modalEvento" style="display:none;">
    <div class="modal-caja">
      <div class="modal-titulo">
        <span id="modalEventoTitulo">Nuevo evento</span>
        <button class="modal-cerrar" id="btnCerrarModalEvento" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="formEvento" novalidate>
        <input type="hidden" id="eventoId">

        <div class="grupo-campo">
          <label class="etiqueta" for="eventoTitulo">Título *</label>
          <input class="campo" type="text" id="eventoTitulo" placeholder="Ej: Reunión de trabajo" maxlength="100" required>
        </div>

        <div class="grupo-campo">
          <label class="etiqueta" for="eventoFecha">Fecha *</label>
          <input class="campo" type="date" id="eventoFecha" required>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="grupo-campo" style="margin-bottom:0;">
            <label class="etiqueta" for="eventoHoraInicio">Hora inicio</label>
            <input class="campo" type="time" id="eventoHoraInicio">
          </div>
          <div class="grupo-campo" style="margin-bottom:0;">
            <label class="etiqueta" for="eventoHoraFin">Hora fin</label>
            <input class="campo" type="time" id="eventoHoraFin">
          </div>
        </div>

        <div class="grupo-campo" style="margin-top:14px;">
          <label class="etiqueta" for="eventoDescripcion">Descripción</label>
          <textarea class="campo" id="eventoDescripcion" rows="3" placeholder="Detalles del evento..." maxlength="500" style="resize:vertical;"></textarea>
        </div>

        <!-- Selector de color -->
        <div class="grupo-campo">
          <label class="etiqueta">Color</label>
          <div id="selectorColor" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
        </div>

        <div class="modal-acciones">
          <button type="button" class="btn btn-peligro" id="btnEliminarEvento" style="display:none; flex:0 0 auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            Eliminar
          </button>
          <button type="submit" class="btn btn-primario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/></svg>
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/modules/agenda.js"></script>
</body>
