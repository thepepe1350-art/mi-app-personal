  <!-- ==========================================
       ENCABEZADO
  =========================================== -->
  <header class="encabezado">
    <h1>Tareas</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="interruptor" id="btnTema" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro"></button>
      <!-- Botón para agregar tarea nueva -->
      <button class="btn btn-primario" id="btnAgregarTarea" style="padding:8px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Nueva tarea
      </button>
    </div>
  </header>

  <!-- ==========================================
       CONTENIDO PRINCIPAL
  =========================================== -->
  <main class="contenido pagina-enter">

    <!-- Barra de filtros: por estado -->
    <div class="tarjeta" style="padding:10px 12px; margin-bottom:12px;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">

        <!-- Filtros por estado -->
        <div style="display:flex; gap:6px; flex:1;">
          <button class="btn-filtro activo" data-filtro-estado="todas">Todas</button>
          <button class="btn-filtro" data-filtro-estado="pendientes">Pendientes</button>
          <button class="btn-filtro" data-filtro-estado="completadas">Completadas</button>
        </div>

        <!-- Filtros por prioridad -->
        <div style="display:flex; gap:6px;">
          <button class="btn-filtro-prioridad activo" data-filtro-prioridad="todas">
            Todas
          </button>
          <button class="btn-filtro-prioridad" data-filtro-prioridad="alta" style="color:#dc2626;">
            Alta
          </button>
          <button class="btn-filtro-prioridad" data-filtro-prioridad="media" style="color:#d97706;">
            Media
          </button>
          <button class="btn-filtro-prioridad" data-filtro-prioridad="baja" style="color:#059669;">
            Baja
          </button>
        </div>

      </div>
    </div>

    <!-- Contador de tareas -->
    <p id="textoContador" style="font-size:0.85rem; color:var(--color-texto-suave); margin-bottom:10px; padding-left:2px;"></p>

    <!-- Lista de tareas -->
    <div id="listaTareas" class="lista-items"></div>

  </main>

  <!-- ==========================================
       MODAL: AGREGAR / EDITAR TAREA
       Aparece cuando se presiona "+ Nueva tarea"
       o cuando se toca una tarea existente.
  =========================================== -->
  <div class="modal-fondo" id="modalTarea" style="display:none;">
    <div class="modal-caja">

      <!-- Título del modal + botón cerrar -->
      <div class="modal-titulo">
        <span id="modalTareasTitulo">Nueva tarea</span>
        <button class="modal-cerrar" id="btnCerrarModal" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Formulario de la tarea -->
      <form id="formTarea" novalidate>

        <!-- ID oculto (para saber si estamos editando) -->
        <input type="hidden" id="tareaId">

        <!-- Título -->
        <div class="grupo-campo">
          <label class="etiqueta" for="tareaTitulo">Título *</label>
          <input class="campo" type="text" id="tareaTitulo" placeholder="Ej: Pagar arriendo" maxlength="100" required>
        </div>

        <!-- Descripción -->
        <div class="grupo-campo">
          <label class="etiqueta" for="tareaDescripcion">Descripción (opcional)</label>
          <textarea class="campo" id="tareaDescripcion" placeholder="Detalles adicionales..." rows="3" style="resize:vertical;" maxlength="500"></textarea>
        </div>

        <!-- Fecha límite y Prioridad en dos columnas -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="grupo-campo" style="margin-bottom:0;">
            <label class="etiqueta" for="tareaFecha">Fecha límite</label>
            <input class="campo" type="date" id="tareaFecha">
          </div>
          <div class="grupo-campo" style="margin-bottom:0;">
            <label class="etiqueta" for="tareaPrioridad">Prioridad</label>
            <select class="campo" id="tareaPrioridad">
              <option value="media">Media</option>
              <option value="alta">Alta</option>
              <option value="baja">Baja</option>
            </select>
          </div>
        </div>

        <!-- Categoría -->
        <div class="grupo-campo" style="margin-top:14px;">
          <label class="etiqueta" for="tareaCategoria">Categoría (opcional)</label>
          <input class="campo" type="text" id="tareaCategoria" placeholder="Ej: Trabajo, Personal, Finanzas..." maxlength="50" list="listaCategorias">
          <!-- Sugerencias de categorías usadas antes -->
          <datalist id="listaCategorias"></datalist>
        </div>

        <!-- Botones guardar / eliminar -->
        <div class="modal-acciones">
          <button type="button" class="btn btn-peligro" id="btnEliminarTarea" style="display:none; flex:0 0 auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3,6 5,6 21,6"/>
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            Eliminar
          </button>
          <button type="submit" class="btn btn-primario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17,21 17,13 7,13 7,21"/>
            </svg>
            Guardar
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Scripts: primero la base de datos, luego la app, luego este módulo -->
  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/modules/tareas.js"></script>

</body>
</html>
