  <header class="encabezado">
    <h1>Panel de datos</h1>
    <button class="interruptor" id="btnTema" aria-label="Cambiar tema"></button>
  </header>

  <main class="contenido pagina-enter">

    <!-- Zona de carga de archivo -->
    <div class="tarjeta" id="zonaSubida">
      <div class="tarjeta-titulo">Cargar archivo</div>
      <div class="zona-drop" id="zonaDrop">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--color-texto-suave); margin-bottom:10px;">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17,8 12,3 7,8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p style="font-weight:600; margin-bottom:6px;">Arrastra tu archivo aquí</p>
        <p style="font-size:0.85rem; color:var(--color-texto-suave); margin-bottom:14px;">o haz clic para seleccionarlo</p>
        <label class="btn btn-primario" style="cursor:pointer;">
          Seleccionar archivo
          <input type="file" id="inputArchivo" accept=".xlsx,.xls,.csv" style="display:none;">
        </label>
        <p style="font-size:0.78rem; color:var(--color-texto-suave); margin-top:10px;">Formatos: Excel (.xlsx, .xls) o CSV (.csv)</p>
      </div>
    </div>

    <!-- Controles (ocultos hasta que hay datos) -->
    <div id="controles" style="display:none;">
      <div class="tarjeta" style="padding:12px;">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <!-- Buscador -->
          <div style="position:relative; flex:1; min-width:180px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--color-texto-suave); pointer-events:none;">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input class="campo" type="search" id="campoBusquedaDatos" placeholder="Buscar en los datos..." style="padding-left:32px; font-size:0.85rem;">
          </div>
          <!-- Info del archivo -->
          <span id="infoArchivo" style="font-size:0.82rem; color:var(--color-texto-suave); white-space:nowrap;"></span>
          <!-- Botones -->
          <button class="btn btn-secundario" id="btnExportarDatos" style="padding:8px 12px; font-size:0.82rem; white-space:nowrap;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar CSV
          </button>
          <button class="btn btn-secundario" id="btnNuevoArchivo" style="padding:8px 12px; font-size:0.82rem; white-space:nowrap;">
            Cargar otro
          </button>
        </div>
      </div>

      <!-- Tabla de datos -->
      <div class="contenedor-tabla">
        <table class="tabla-datos" id="tablaDatos">
          <thead id="tablaDatosHead"></thead>
          <tbody id="tablaDatosBody"></tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-top:12px;" id="paginacion">
        <button class="btn btn-secundario" id="btnPagAnterior" style="padding:6px 14px;">‹ Anterior</button>
        <span id="textoPagina" style="font-size:0.85rem; color:var(--color-texto-suave);"></span>
        <button class="btn btn-secundario" id="btnPagSiguiente" style="padding:6px 14px;">Siguiente ›</button>
      </div>
    </div>

  </main>

  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/modules/datos.js"></script>
</body>
</html>
