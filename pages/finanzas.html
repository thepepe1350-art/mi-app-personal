<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MiApp">
  <title>Finanzas — Mi App Personal</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

      </svg>
      Mi App
    </div>

    <a href="../index.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      Inicio
    </a>

    <a href="agenda.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Agenda
    </a>

    <a href="tareas.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,11 12,14 22,4"/>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Tareas
    </a>

    <a href="notas.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Notas
    </a>

    <a href="finanzas.html" class="menu-item activo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
      </svg>
      Finanzas
    </a>

    <a href="datos.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Datos
    </a>

    <a href="conversor.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="17,1 21,5 17,9"/>
        <path d="M3 11V9a4 4 0 014-4h14"/>
        <polyline points="7,23 3,19 7,15"/>
        <path d="M21 13v2a4 4 0 01-4 4H3"/>
      </svg>
      Conversor
    </a>

    <a href="ordenar.html" class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      Ordenar
    </a>

  </nav>

  <!-- ==========================================
       ENCABEZADO
  =========================================== -->
  <header class="encabezado">
    <h1>Finanzas</h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <input type="month" id="selectorMes" class="campo" style="padding:6px 10px; font-size:0.85rem; width:auto;">
      <button class="btn btn-secundario" id="btnGestionarCats" style="padding:8px 12px;" title="Gestionar categorías">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
        </svg>
        Categorías
      </button>
      <button class="interruptor" id="btnTema" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro"></button>
    </div>
  </header>

  <!-- ==========================================
       CONTENIDO PRINCIPAL
  =========================================== -->
  <main class="contenido pagina-enter">

    <!-- ── Sueldo y resumen del mes ── -->
    <div class="tarjeta">
      <div class="tarjeta-titulo">Sueldo del mes</div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input
          type="number"
          class="campo"
          id="campoSueldo"
          placeholder="Ej: 1000000"
          min="0"
          style="flex:1;"
        >
        <button class="btn btn-primario" id="btnGuardarSueldo" style="padding:10px 16px; white-space:nowrap;">
          Guardar
        </button>
      </div>
      <div id="resumenMes"></div>
    </div>

    <!-- ── Gráficos ── -->
    <div class="tarjeta">
      <div class="tarjeta-titulo">Gráficos</div>

      <!-- Botones de tab -->
      <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
        <button class="tab-grafico btn btn-primario" data-tab="distribucion"
          style="padding:7px 14px; font-size:0.82rem; flex:1; min-width:100px;">
          Distribución
        </button>
        <button class="tab-grafico btn btn-secundario" data-tab="presupuesto"
          style="padding:7px 14px; font-size:0.82rem; flex:1; min-width:100px;">
          Ppto. vs Real
        </button>
        <button class="tab-grafico btn btn-secundario" data-tab="evolucion"
          style="padding:7px 14px; font-size:0.82rem; flex:1; min-width:100px;">
          Evolución
        </button>
      </div>

      <!-- Panel: Distribución de gastos (dona) -->
      <div id="panel-distribucion" class="panel-grafico">
        <canvas id="graficoDistribucion" style="max-height:300px;"></canvas>
      </div>

      <!-- Panel: Presupuesto vs Real (barras) -->
      <div id="panel-presupuesto" class="panel-grafico" style="display:none;">
        <canvas id="graficoPresupuesto" style="max-height:300px;"></canvas>
      </div>

      <!-- Panel: Evolución mensual (línea) -->
      <div id="panel-evolucion" class="panel-grafico" style="display:none;">
        <canvas id="graficoEvolucion" style="max-height:300px;"></canvas>
      </div>
    </div>

    <!-- ── Metas de Ahorro ── -->
    <div class="tarjeta">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="tarjeta-titulo" style="margin-bottom:0;">Metas de Ahorro</div>
        <button class="btn btn-primario" id="btnAgregarMeta" style="padding:8px 14px; font-size:0.84rem; white-space:nowrap;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:4px;">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Nueva meta
        </button>
      </div>
      <!-- Proyección promedio de ahorro -->
      <div id="proyeccionAhorro"></div>
      <!-- Lista de metas -->
      <div id="listaMetas"></div>
    </div>

    <!-- ── Presupuesto por categoría ── -->
    <div class="tarjeta">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="tarjeta-titulo" style="margin-bottom:0;">Presupuesto por categoría</div>
        <span style="font-size:0.78rem; color:var(--color-texto-suave);">Ingresa el monto por categoría</span>
      </div>
      <div id="listaCategoriasFin"></div>
    </div>

    <!-- ── Botón registrar gasto ── -->
    <button class="btn btn-primario" id="btnAgregarGasto" style="width:100%; justify-content:center; margin-bottom:16px; padding:13px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Registrar gasto
    </button>

    <!-- ── Historial de gastos ── -->
    <div class="tarjeta">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div class="tarjeta-titulo" style="margin-bottom:0;">Gastos del mes</div>
        <button class="btn btn-secundario" id="btnExportar" style="padding:6px 12px; font-size:0.8rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Exportar CSV
        </button>
      </div>
      <div id="listaGastos" class="lista-items"></div>
    </div>

  </main>

  <!-- ==========================================
       MODAL: REGISTRAR GASTO
  =========================================== -->
  <div class="modal-fondo" id="modalGasto" style="display:none;">
    <div class="modal-caja">
      <div class="modal-titulo">
        <span>Registrar gasto</span>
        <button class="modal-cerrar" id="btnCerrarModalGasto" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="formGasto" novalidate>
        <div class="grupo-campo">
          <label class="etiqueta" for="gastoMonto">Monto *</label>
          <input class="campo" type="number" id="gastoMonto" placeholder="Ej: 15000" min="1" required>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="grupo-campo" style="margin-bottom:0;">
            <label class="etiqueta" for="gastoCat">Categoría</label>
            <select class="campo" id="gastoCat"></select>
          </div>
          <div class="grupo-campo" style="margin-bottom:0;">
            <label class="etiqueta" for="gastoFecha">Fecha</label>
            <input class="campo" type="date" id="gastoFecha">
          </div>
        </div>
        <div class="grupo-campo" style="margin-top:14px;">
          <label class="etiqueta" for="gastoDesc">Descripción (opcional)</label>
          <input class="campo" type="text" id="gastoDesc" placeholder="Ej: Supermercado Lider" maxlength="100">
        </div>
        <div class="modal-acciones">
          <button type="submit" class="btn btn-primario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17,21 17,13 7,13 7,21"/>
            </svg>
            Guardar gasto
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================
       MODAL: GESTIONAR CATEGORÍAS
  =========================================== -->
  <div class="modal-fondo" id="modalCats" style="display:none;">
    <div class="modal-caja">
      <div class="modal-titulo">
        <span>Gestionar categorías</span>
        <button class="modal-cerrar" id="btnCerrarModalCats" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="listaCatsModal" style="margin-bottom:20px;"></div>
      <div class="separador"></div>
      <p style="font-size:0.85rem; font-weight:600; color:var(--color-texto-suave); margin:14px 0 10px;">Agregar nueva categoría</p>
      <form id="formNuevaCat" novalidate style="display:flex; gap:8px;">
        <input class="campo" type="text" id="nuevaCatNombre" placeholder="Nombre de la categoría" maxlength="40" required style="flex:1;">
        <button type="submit" class="btn btn-primario" style="white-space:nowrap; padding:10px 16px;">
          Agregar
        </button>
      </form>
    </div>
  </div>

  <!-- ==========================================
       MODAL: NUEVA META DE AHORRO
  =========================================== -->
  <div class="modal-fondo" id="modalMeta" style="display:none;">
    <div class="modal-caja">
      <div class="modal-titulo">
        <span>Nueva meta de ahorro</span>
        <button class="modal-cerrar" id="btnCerrarModalMeta" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="formMeta" novalidate>
        <div class="grupo-campo">
          <label class="etiqueta" for="metaNombre">Nombre de la meta *</label>
          <input class="campo" type="text" id="metaNombre" placeholder="Ej: Computador nuevo" maxlength="60" required>
        </div>
        <div class="grupo-campo">
          <label class="etiqueta" for="metaMonto">Costo total *</label>
          <input class="campo" type="number" id="metaMonto" placeholder="Ej: 1200000" min="1" required>
        </div>
        <div class="grupo-campo">
          <label class="etiqueta" for="metaAhorroPorMes">¿Cuánto podés ahorrar por mes? *</label>
          <input class="campo" type="number" id="metaAhorroPorMes" placeholder="Ej: 150000" min="1" required>
        </div>
        <!-- Cálculo en tiempo real -->
        <div id="calculoMeta" style="display:none; padding:10px 14px; background:rgba(26,115,232,0.08); border-radius:10px; border-left:3px solid #1a73e8; font-size:0.85rem; margin-bottom:14px;"></div>
        <div class="modal-acciones">
          <button type="submit" class="btn btn-primario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12,6 12,12 16,14"/>
            </svg>
            Crear meta
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================
       MODAL: ABONAR A META
  =========================================== -->
  <div class="modal-fondo" id="modalAbonar" style="display:none;">
    <div class="modal-caja">
      <div class="modal-titulo">
        <span>Abonar a meta</span>
        <button class="modal-cerrar" id="btnCerrarModalAbonar" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <p id="infoMetaAbonar" style="font-size:0.85rem; color:var(--color-texto-suave); margin-bottom:14px; line-height:1.5;"></p>
      <form id="formAbonar" novalidate>
        <div class="grupo-campo">
          <label class="etiqueta" for="montoAbonar">Monto a abonar *</label>
          <input class="campo" type="number" id="montoAbonar" placeholder="Ej: 50000" min="1" required>
        </div>
        <div class="modal-acciones">
          <button type="submit" class="btn btn-primario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
            </svg>
            Abonar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/modules/finanzas.js"></script>

</body>
</html>
